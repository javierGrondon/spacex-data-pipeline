# SpaceX Data Pipeline — Airflow + Postgres + Dashboard de monitoreo
# Uso:  cp .env.example .env   &&   docker compose up -d
#   Airflow:    http://localhost:8080  (admin / admin)
#   Dashboard:  http://localhost:8501

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5-python3.12
  env_file:
    - path: .env
      required: false
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8080
    WAREHOUSE_URL: postgresql+psycopg2://airflow:airflow@postgres:5432/warehouse
    DATA_DIR: /opt/airflow/data
    SAMPLE_DIR: /opt/airflow/sample_data
  volumes:
    - ./dags:/opt/airflow/dags
    - ./plugins:/opt/airflow/plugins
    - ./sample_data:/opt/airflow/sample_data
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/data /opt/airflow/logs
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true
    user: "0:0"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dashboard:
    build: ./dashboard
    environment:
      AIRFLOW_DB_URL: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      WAREHOUSE_URL: postgresql+psycopg2://airflow:airflow@postgres:5432/warehouse
    ports:
      - "8501:8501"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
